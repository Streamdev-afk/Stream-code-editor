name: Desktop app

# Builds the installable ION Qoders editor for Windows, Mac and Linux.
# Every push to main builds the app and publishes a new release automatically (version 1.0.<run number>, tag made for you).
# You can also start it by hand from the Actions tab (Run workflow) or push a tag like v1.2.0.
# The finished installers are published to a small PUBLIC repo (secret RELEASES_REPO, e.g. yourname/ion-qoders-releases),
# so installed apps can look for updates without any login. Your source code repo stays private.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build the editor
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Package the desktop app
        working-directory: desktop
        shell: bash
        run: |
          npm install
          # tell the app where to look for updates (the public releases repo)
          if [ -n "$RELEASES_REPO" ]; then
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('package.json'));const [owner,repo]=process.env.RELEASES_REPO.split('/');d.build.publish=[{provider:'github',owner,repo}];fs.writeFileSync('package.json',JSON.stringify(d,null,2))"
          fi
          # version: the tag if you pushed one, otherwise 1.0.<run number> so it always goes up
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.0.${{ github.run_number }}"; fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
      - uses: actions/upload-artifact@v4
        with:
          name: ion-qoders-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.blockmap
            desktop/release/latest*.yml
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ env.APP_VERSION }}
          name: ION Qoders ${{ env.APP_VERSION }}
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.blockmap
            desktop/release/latest*.yml
